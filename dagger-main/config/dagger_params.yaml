# =============================================================================
# DAgger 系统配置 — Phase 1: 异步推理框架
# =============================================================================

# ===== Python 路径 =====
# dagger_node / control_panel / PolicyServer 需要同时 import rclpy 和 torch
# "auto" = 使用 ros2 launch 的系统 Python（推荐，系统 Python 3.12 已有 rclpy + torch）
# 也可指定绝对路径覆盖，如: "/usr/bin/python3"
python_path: "auto"

# ===== 机器人配置 =====
robot_ip: "192.168.1.18"
robot_port: 8080
rm_plus_baud: 115200
dry_run: false

# ===== PolicyServer 配置 =====
server_address: "127.0.0.1:50051"
task: "pick up the yellow banana and put it in the white plate"
 
# ===== PolicyServer 自动启动配置 =====
policy_server:
  # 是否由 launch 自动启动 PolicyServer（false=手动启动）
  auto_launch: true
  # PolicyServer 使用的 Python 路径（VLA 模型需要 transformers 等额外依赖）
  # "auto" = 使用与 dagger_node 相同的 python_path（系统 Python）
  # VLA 模型（smolvla/pi0/pi0fast）建议使用 conda 环境的 Python
  python_path: "/home/ubuntu/Desktop/Workspace/miniconda3/envs/robocoin/bin/python"
  # 策略类型: act, diffusion, pi0, pi0fast, smolvla, openpi, octo
  policy_type: "act"
  # 预训练模型路径（绝对路径或相对于 RoboCOIN 目录）
  pretrained_path: "/media/ubuntu/SSD500G1/robocoin_weights/act_delta_pose_bs64_chunk50_0315-97episodes/checkpoints/100000/pretrained_model"
  # 推理设备
  device: "cuda"
  # gRPC 端口（与 server_address 的端口一致）
  port: 50051
  # 额外参数（透传给 PolicyServer）
  # ACT/Diffusion 等模型通常不需要额外参数
  extra_args: []
  # --- OpenPI 远程模式示例 ---
  # 使用 OpenPI 时，将 policy_type 改为 "openpi"，并配置 extra_args:
  #   policy_type: "openpi"
  #   extra_args:
  #     - "--openpi_remote_host=localhost:8000"
  #     - "--openpi_config_name=realman_pi0"
  #   # 注意: --default_prompt 在远程模式下由 serve_realman_policy.py 配置，
  #   #       不需要在 extra_args 中指定

# ===== 执行配置 =====
# f_exec: 固定执行频率 Hz
# 建议: 首次测试从 10Hz 开始，逐步提高到 30Hz
# 注意: 必须高于 policy 推理频率，否则 ring_buffer 会持续积压
f_exec: 30.0
# hold_on_empty: ring buffer 空时是否重发最后一个 action
# true = 机械臂保持运动（平滑），false = 机械臂停止（安全）
hold_on_empty: true

# ===== 推理配置 =====
# n_action_steps: 每次从 ActionChunk 截取的步数（0=使用全部）
# OpenPI 推荐: n_action_steps=0，不在 PolicyServer 端截取，
# 由 InferenceBridge 的自适应 K_inf 裁剪处理所有截取逻辑。
# 如果同时在 PolicyServer 和 InferenceBridge 两端截取，会导致双重截取，
# 使有效动作数大幅减少甚至系统不可行。
n_action_steps: 0
# T_inter: 两次推理之间的最小间隔（秒）
# 0 = 推理完成后立即触发下一次（最大吞吐）
# >0 = 控制推理频率，减少 GPU 负载
# 稳定性约束: T_inter + t_inf < chunk_size / f_exec
T_inter: 0.0
# t_inf: 实测推理延迟秒数（0=启动时自动测量 warmup）
t_inf: 0
# chunk_size_threshold: 模型 chunk_size 阈值（0=启动时自动从模型获取）
chunk_size_threshold: 0

# ===== 相机配置 =====
camera_configs:
  cam0_rgb:
    type: intelrealsense
    serial_number_or_name: "230422272673"
    fps: 30
    width: 640
    height: 480
  cam1_rgb:
    type: intelrealsense
    serial_number_or_name: "420122071413"
    fps: 30
    width: 640
    height: 480
camera_rotations:
  cam0_rgb: 180
# ROS2 话题名映射：camera_configs key → ROS2 camera_node 的 name
# 订阅 /camera/<ros_name>/color/image_raw，回调中用 camera_configs key 作为推理 image key
# 顺序必须与 camera_configs 一致
camera_ros_names:
  cam0_rgb: "cam0"
  cam1_rgb: "cam1"

# ===== 夹爪配置 =====
gripper_binarize: false
gripper_binarize_threshold: 500
gripper_binarize_hysteresis: 50
gripper_deadband: 20

# ===== 可视化 =====
visualize: false
vis_scale: 1.0
max_steps: 0  # 0=无限

# =============================================================================
# Phase 2A: UDP 状态接收配置
# =============================================================================
# 启用 UDP 状态接收（替代 TCP 阻塞式状态获取）
enable_udp_state: true
udp_state_port: 8089
# UDP 推送周期: 1=5ms/200Hz, 2=10ms/100Hz, 5=25ms/40Hz
# 建议 cycle=2 (100Hz)，对 30Hz 执行循环有 3x 余量
udp_push_cycle: 2
# UDP 接收超时（秒）: 超过此时间未收到数据则报警
udp_recv_timeout: 1.0

# =============================================================================
# Phase 2A: 录制配置
# =============================================================================
enable_recording: true
repo_id: "local/dagger_realman_0315-1"
dataset_root: "/home/ubuntu/Desktop/Workspace/lerobot_policy_deploy/lerobotv3/dagger/data"
use_videos: true
image_writer_threads: 4
image_writer_processes: 0
# recording_task 描述（写入 episode 元数据）
recording_task: "pick and place"
# 录制帧率（与 control_hz 无关，仅影响 dataset metadata）
recording_fps: 30
# 最大 episode 数（0=无限制）
max_episodes: 0

# =============================================================================
# Phase 3: VR 控制配置 (dagger_node.py)
# =============================================================================
vr_control:
  # 控制频率 (Hz)，与 realman_driver_node 的 state_hz 匹配
  control_hz: 30.0
  # VR 手柄侧
  side: "right"
  # trigger 激活阈值 (0-1)
  trigger_threshold: 0.85
  # 旋转映射方案（详见 vr_utils.py ROTATION_MAPPING_PRESETS）
  rotation_preset: "perm_xyz_pnn"
  # EMA 位置滤波系数（越小越平滑，越大越跟手）
  alpha_pos: 0.8
  # EMA 旋转滤波系数
  alpha_rot: 0.8

# =============================================================================
# Phase 3: 策略推理配置 (inference_bridge.py)
# =============================================================================
inference:
  # 是否启用策略推理（false=仅 VR 遥操作模式）
  enable_policy: true
  # PolicyServer gRPC 地址（复用 Phase 1 的 server_address）
  # server_address: 使用顶层 server_address 配置

# =============================================================================
# Phase 3: 安全配置
# =============================================================================
safety:
  # 单步最大关节角度变化（度），超过则拒绝执行
  max_joint_delta_deg: 5.0
  # 单步最大笛卡尔位移（米），超过则拒绝执行
  max_pose_delta_m: 0.02

# =============================================================================
# Web UI 控制面板配置
# =============================================================================
web_ui:
  # 是否启用 Web UI 控制面板
  enable: true
  # Web UI 端口
  port: 5002
  # 相机名称列表（用于 Web UI 预览，从 camera_configs 自动获取）
  # camera_names: 使用顶层 camera_configs 的 key 列表
